# RustCraft traversal prototype: the harpoon and the zipline moved five ways on a dedicated
# server, with a journal per tick. See ../../README.md. All tuning numbers are in rules.rs.
[mod]
id = "rc_traversal"
version = "0.1.0"

# The commit path_of_craft_tree builds on; every function used here was checked in its source.
[compatibility]
horizon_revision = "7e4e421224743469035ba0c34fc21e569e64a17d"

# Game-free code, also built alone by ../../lib.rs for `cargo test`.
[[module]]
id = "rules"
file = "crates/horizon-client/src/game.rs"
name = "trv_rules"
source = "rules.rs"

[[module]]
id = "plans"
file = "crates/horizon-client/src/game.rs"
name = "trv_plans"
source = "plans.rs"

[[module]]
id = "measure"
file = "crates/horizon-client/src/game.rs"
name = "trv_measure"
source = "measure.rs"

[[module]]
id = "wire"
file = "crates/horizon-client/src/game.rs"
name = "trv_wire"
source = "wire.rs"

[[module]]
id = "journal"
file = "crates/horizon-client/src/game.rs"
name = "trv_journal"
source = "journal.rs"

# The game halves.
[[module]]
id = "server"
file = "crates/horizon-client/src/game.rs"
name = "trv_server"
source = "server.rs"

[[module]]
id = "drive"
file = "crates/horizon-client/src/game.rs"
name = "trv_drive"
source = "drive.rs"

[[module]]
id = "client"
file = "crates/horizon-client/src/game.rs"
name = "trv_client"
source = "client.rs"

# The hub that sends a player back lives in the client library, below the game crate, so the
# list of corrections it fills must live there too.
[[module]]
id = "setbacks"
file = "crates/horizon-client/src/client_lib.rs"
name = "trv_setbacks"
source = "setbacks.rs"
visibility = "pub"

# ---- Server half ----

[[injection]]
id = "net_from_client"
hook = "net_from_client"
hook_version = 1
kind = "HEAD"
helper = "hook_net_from_client.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "player", ty = "u128", value = "player" },
  { name = "channel", ty = "&str", value = "channel" },
  { name = "data", ty = "&[u8]", value = "data" },
]

# Each level after its tick, with that level in place: the mob and teleport helpers need it.
[[injection]]
id = "level_tick"
hook = "level_tick_post"
hook_version = 1
kind = "HEAD"
helper = "hook_level_tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "dimension", ty = "&str", value = "dimension" },
]

[[injection]]
id = "logged_out"
hook = "player_logged_out"
hook_version = 1
kind = "HEAD"
helper = "hook_logged_out.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "player", ty = "u128", value = "player" },
]

[[injection]]
id = "stopping"
hook = "server_stopping"
hook_version = 1
kind = "HEAD"
helper = "hook_stopping.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

# Every correction the server sends a player passes here: moved too quickly, moved wrongly,
# the anticheat's setback, a teleport sent again. No hook tells a mod about them
# (native_player_teleport leaves them out), so the prototype listens at the function.
[[injection]]
id = "resend_teleport"
target = "horizon_client_lib::lan::hub::Hub::resend_teleport"
kind = "HEAD"
helper = "hook_resend_teleport.rs"
bindings = [
  { name = "hub", ty = "&Hub", value = "&*self" },
  { name = "i", ty = "usize", value = "i" },
  { name = "position", ty = "Option<[f64; 3]>", value = "position" },
]

# A fall about to hurt (LivingFallEvent, API 357). Injected at the function, not the named
# hook, because the named hook stays silent for a bundle with no regular mod.
[[injection]]
id = "living_fall"
target = "horizon_client_lib::landing::native_living_fall"
kind = "HEAD"
helper = "hook_living_fall.rs"
bindings = [
  { name = "entity", ty = "u32", value = "entity" },
  { name = "cancel", ty = "&mut bool", value = "&mut *cancel" },
]

# ---- Client half ----

[[injection]]
id = "command"
hook = "command"
hook_version = 1
kind = "HEAD"
helper = "hook_command.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "command", ty = "&str", value = "command" },
  { name = "ran", ty = "&mut bool", value = "&mut *ran" },
]

# Runs on every Game, the server's too: the helper keeps to the window's.
[[injection]]
id = "tick"
hook = "tick"
hook_version = 1
kind = "HEAD"
helper = "hook_tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

[[injection]]
id = "net_from_server"
hook = "net_from_server"
hook_version = 1
kind = "HEAD"
helper = "hook_net_from_server.rs"
bindings = [
  { name = "channel", ty = "&str", value = "channel" },
  { name = "data", ty = "&[u8]", value = "data" },
]

[[injection]]
id = "client_packet"
hook = "client_packet"
hook_version = 1
kind = "HEAD"
helper = "hook_client_packet.rs"
bindings = [
  { name = "packet", ty = "&horizon_client::mod_api::ClientboundPlayPacket", value = "packet" },
]

# No named hook point yet (API @API:world_primitives@ in this commit): its function.
[[injection]]
id = "world_primitives"
target = "horizon_client::game::native_hooks::Game<'_>::native_world_primitives"
kind = "HEAD"
helper = "hook_world_primitives.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "partial", ty = "f32", value = "partial" },
  { name = "primitives", ty = "&mut horizon_client::world_primitives::WorldPrimitives", value = "&mut *primitives" },
]
