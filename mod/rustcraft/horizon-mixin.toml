name = "rustcraft_falls"
source = "falls.rs"
visibility = "pub"

# ---- Registries, asked once at start on every side (API 145) ----

[[injection]]
id = "blocks"
hook = "blocks"
hook_version = 1
kind = "HEAD"
helper = "hook_blocks.rs"
bindings = [
  { name = "blocks", ty = "&mut Vec<horizon_mods::content::Block>", value = "&mut *blocks" },
]

[[injection]]
id = "items"
hook = "items"
hook_version = 1
kind = "HEAD"
helper = "hook_items.rs"
bindings = [
  { name = "items", ty = "&mut Vec<horizon_mods::content::Item>", value = "&mut *items" },
]

# Every side makes the block entity when the block is placed or loaded (API 15).
[[injection]]
id = "block_entity"
hook = "block_entity"
hook_version = 1
kind = "HEAD"
helper = "hook_block_entity.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "entity", ty = "&mut Option<(String, horizon_world::nbt::Compound)>", value = "&mut *entity" },
]

# The furnace's slots and the menu they open in, asked once a block when a world's ticking table
# is built, on every side (API 17; native_hooks.rs:3349-3364, block_entity_ticks.rs:24-34).
[[injection]]
id = "block_entity_container"
hook = "block_entity_container"
hook_version = 1
kind = "HEAD"
helper = "hook_block_entity_container.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "container", ty = "&mut Option<horizon_client::containers::ModContainer>", value = "&mut *container" },
]

# ---- Server half ----

# A right click with an item on a block, once the block let it through (API 13).
[[injection]]
id = "use_item_on"
hook = "use_item_on"
hook_version = 1
kind = "HEAD"
helper = "hook_use_item_on.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "stack", ty = "&horizon_client::items::ItemStack", value = "stack" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "claimed", ty = "&mut bool", value = "&mut *claimed" },
]

# A right click on a block, before the block's own use and the item's, cancellable (API 21):
# the wrench on a housing, or on a block behind a joint, opens the joint window instead.
[[injection]]
id = "right_click_block"
hook = "right_click_block"
hook_version = 1
kind = "HEAD"
helper = "hook_right_click_block.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "face", ty = "[i32; 3]", value = "face" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

# A press on a machine window's mode button, on the server (API 20).
[[injection]]
id = "menu_button"
hook = "menu_button"
hook_version = 1
kind = "HEAD"
helper = "hook_menu_button.rs"
bindings = [
  { name = "entity", ty = "&mut horizon_client::containers::ModBlockEntity", value = "&mut *entity" },
  { name = "id", ty = "i32", value = "id" },
]

# The same press with the player's cursor stack (API 51): an autocrafter's pattern cell takes it,
# and a terminal's place takes or gives a stack. The clicking player is swapped in
