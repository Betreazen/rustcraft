# RustCraft for Horizon. Slice 1: the magistral's housing and node as blocks, the channel items
# and the wrench, slots saved in the housing's block entity, and the diagnosis of a looked-at
# housing (spec M1-M3, N3). Slice 2: the energy crystal and the electric furnace, items moved
# along item channel nets between joints (M6-M8, M16, M17), energy by contact and through energy
# channel nets (E2, E3, E10), the furnace's window and diagnoses (A1, A4). Slice 3: the
# machines' own window (their content mod's menu types, drawn by rustcraft_screens), the work
# modes (A1), the joint window with per-face, per-slot direction, filter and priority (M7), and
# the crusher with its dusts. Slice 4: the fuel generator (16 E/s while a furnace fuel burns,
# E17's circuit balance in its window), the alloy smelter (four inputs, fuel or energy, AL1's
# «брать свой сплав») with the alloys, and the autocrafter (pages of 3×3 patterns matched by the
# crafting table's own matcher, C1–C4) with the capacity module. Slice 5: the storage (cells in a
# solid box keeping counts, S1–S8, and its terminal with pages, search, tabs and limits, TM1) on
# the item nets, the tank (touching tanks are one) and the pump (water endless by the game's rules,
# lava finite), and fluids along fluid channel nets (M13). Slice 6: the monorail (rails on any
# face, their shape chosen from their neighbours, T1–T4), the station (its buffer of energy, its
# window with the network's scheme, T6–T8) and the capsule, which carries the player along the
# shortest way by the traversal prototype's method b2 (an invisible-to-the-rules seat mob the server
# moves, spec 16) and which every client draws round its seat (T3, T9). See ../README.md.
# Resources are the content mod in ../content, under the same id.
#
# Every hook below is a named hook point (SRC/native-hooks.json) with a HEAD injection into its
# function, so it runs whatever mod_api::mods() holds: none of their callers checks for a trait
# mod (mods.rs:57-75, game.rs:6966-6969 and 6481-6482 and 7246, levels.rs:511-560,
# native_hooks.rs:11540-11555 and 11656, all under SRC/crates/horizon-client/src). Slice 2's:
# right_click_block from `use_hand` (game.rs:6735-6750), block_entity_container from the
# ticking table (game/block_entity_ticks.rs:24-34 through native_hooks.rs:11718-11748). Slice
# 3's: screen from the menu's opening and `native_hidden_slots` (native_hooks.rs:11885-11950),
# screen_draw, screen_click and screen_tooltip from the open mod screen (native_hooks.rs:
# 12026-12060, 12160-12200), menu_button from `mod_menu_button` (native_hooks.rs:12133-12146),
# menu_clicked and menu_closed from `run_native_menu_events` (game/native_menus.rs:441-468),
# menu_slot_rules from the menu engine's `mod_slot` (menu.rs:1549-1560). Slice 4's:
# menu_button_v2 from `mod_menu_button` right after menu_button (native_hooks.rs:12133-12146);
# container_accepts, which has no catalog entry, by its target, from `mod_container_accepts`
# (game/machines.rs:616-638), which every hopper move and `native_move_items` ask. Slice 5's:
# menu_quick_move from `mod_menu_quick_move` (game/native_quick_move.rs:186-214),
# player_container_open and _close from `tick_player_menus` (game/native_menus.rs:348-418),
# net_from_server from `remote_native_net` (game/native_net.rs:160-165), screen_key_pressed_pre
# and screen_char_typed_pre from `screen_key_pressed` and `screen_chars_typed`
# (native_hooks.rs:4161-4245, control.rs:684 and 1050 for the control socket's keys and typing).
# Slice 6's: state_for_placement from vanilla's placement (game/native_hooks.rs:1776, API 76),
# net_from_client (native_hooks.rs:8397), player_logged_out (8487) and server_stopping (2547), and
# on the client mob_submit (native_hooks.rs:3673, from game/creatures.rs:7636, asked for every mob
# in view that is not invisible) and standalone_models (native_hooks.rs:3259); living_fall, which
# stays silent for a bundle without a trait mod, by its target (landing.rs:32), as the traversal
# prototype hooked it.
[mod]
id = "rustcraft"
version = "0.8.0"

# The commit the traversal prototype and path_of_craft_tree build on; every function used here
# was checked in its source.
[compatibility]
horizon_revision = "7e4e421224743469035ba0c34fc21e569e64a17d"

# The game-free rules, compiled and cached apart from the game. Helpers and modules call it by
# its package name (`rustcraft-rules`, in code `rustcraft_rules`), the name the stage adds to horizon-client's [dependencies]
# (SRC/docs/native-mods.md:550-552).
[[crate]]
id = "rules"
path = "rules"

# The glue: what is registered, and the server's side of the magistral.
[[module]]
id = "content"
file = "crates/horizon-client/src/game.rs"
name = "rustcraft_content"
source = "content.rs"

[[module]]
id = "server"
file = "crates/horizon-client/src/game.rs"
name = "rustcraft_server"
source = "server.rs"

# Energy and the furnace, every tick.
[[module]]
id = "machines"
file = "crates/horizon-client/src/game.rs"
name = "rustcraft_machines"
source = "machines.rs"

# Joints, item moves and the wrench.
[[module]]
id = "transport"
file = "crates/horizon-client/src/game.rs"
name = "rustcraft_transport"
source = "transport.rs"

# The joint window: a server menu (M7).
[[module]]
id = "window"
