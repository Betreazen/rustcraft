hook = "menu_button_v2"
hook_version = 1
kind = "HEAD"
helper = "hook_menu_button_v2.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "entity", ty = "&mut horizon_client::containers::ModBlockEntity", value = "&mut *entity" },
  { name = "id", ty = "i32", value = "id" },
  { name = "carried", ty = "&mut Option<horizon_client::items::ItemStack>", value = "&mut *carried" },
]

# A shift-click in a terminal's window (API 309): a stack of the inventory goes into the storage,
